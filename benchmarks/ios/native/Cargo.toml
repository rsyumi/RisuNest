[package]
name = "risunest-ios-bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "ios_bench"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
risunest = { path = "../../../src-tauri" }
tauri = { version = "2.11.5", features = ["protocol-asset"] }
serde_json = "1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = { version = "2.5.9", features = ["unsafe-headers"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-native = { path = "../../../crates/tauri-plugin-ios-native" }
tauri-plugin-barcode-scanner = { path = "../../../crates/tauri-plugin-barcode-scanner" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol", "risunest/custom-protocol"]
