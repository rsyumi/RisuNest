  <style>
    /* The onboarding screen's palette and shapes, written out as literals
       because this page is served on its own and cannot read the app theme. */
    :root {
      color-scheme: dark;
      --o-bg: #282a36;
      --o-panel: #21222c;
      --o-line: #4b5563;
      --o-btn: #374151;
      --o-hover: #44475a;
      --o-ink: #f5f5f5;
      --o-soft: rgba(245, 245, 245, .64);
      --o-faint: rgba(245, 245, 245, .4);
      --o-blue: #3b82f6;
      --o-blue-strong: #2563eb;
      --o-teal: #22c8c6;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      background: var(--o-bg);
      color: var(--o-ink);
      font: 14px/1.5 Arial, "Malgun Gothic", sans-serif;
    }
    /* Korean has no spaces inside a word, so the default break rule splits
       words mid-syllable. */
    html:lang(ko) body { word-break: keep-all; }
    .onb {
      display: grid;
      grid-template-rows: 200px auto;
      width: min(100%, 560px);
      overflow: hidden;
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .34);
    }
    .brand {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(22px + env(safe-area-inset-top, 0px)) 24px 30px;
      overflow: hidden;
    }
    .weave { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wm { position: relative; display: block; width: 132px; height: auto; }
    .eyebrow {
      position: relative;
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      color: var(--o-teal);
    }
    .panel {
      position: relative;
      margin-top: -18px;
      padding: 26px 24px 24px;
      border-radius: 22px 22px 0 0;
      background: var(--o-panel);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.28;
      letter-spacing: -.01em;
      text-wrap: balance;
    }
    .lead { margin: 0 0 20px; font-size: 13.5px; color: var(--o-soft); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 22px;
      border: 1px solid var(--o-line);
      border-radius: 10px;
      background: var(--o-btn);
      color: inherit;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: var(--o-hover); }
    .btn.primary { border-color: transparent; background: var(--o-blue); color: #fff; }
    .btn.primary:hover { background: var(--o-blue-strong); }
    :focus-visible { outline: 2px solid var(--o-blue); outline-offset: 2px; }
    [hidden] { display: none !important; }
    #notice { min-height: 22px; margin: 14px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--o-teal); }
    #manual { margin-top: 14px; }
    label { display: block; margin-bottom: 10px; font-size: 12.5px; color: var(--o-soft); }
    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid var(--o-line);
      border-radius: 10px;
      background: rgba(245, 245, 245, .03);
      color: var(--o-soft);
      font: 12px/1.6 monospace;
      overflow-wrap: anywhere;
    }
    .foot { display: block; margin: 0; padding-top: 22px; font-size: 12px; color: var(--o-faint); }
    @media (max-width: 600px) {
      body { padding: 0; }
      .onb {
        grid-template-rows: 236px 1fr;
        width: 100%;
        min-height: 100svh;
        border-radius: 0;
        box-shadow: none;
      }
      .btn { width: 100%; }
      .panel { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
</head>

      <p class="eyebrow">GOOGLE DRIVE</p>

    <div class="panel">
      <h1 id="title">인증 결과 확인 중</h1>
      <p id="description" class="lead">잠시만 기다려 주세요.</p>
      <div id="actions" class="actions" hidden>
        <a id="open" class="btn primary">RisuNest로 돌아가기</a>
        <button id="copy" type="button" class="btn">인증 결과 복사</button>
      </div>
      <p id="notice" role="status" aria-live="polite"></p>
      <div id="manual" hidden>
        <label id="manual-label" for="result">아래 내용을 복사해 앱의 인증 결과 입력란에 붙여넣으세요.</label>
        <textarea id="result" readonly autocomplete="off" spellcheck="false"></textarea>
      </div>
      <footer id="footer" class="foot">이 창은 인증이 끝나면 닫아도 됩니다.</footer>
      <noscript class="foot">JavaScript를 켜거나, 주소 표시줄의 전체 주소를 앱의 인증 결과 입력란에 붙여넣으세요.</noscript>
    </div>
  </div>
  <script>
(() => {
  'use strict';
  const korean = navigator.language.toLowerCase().startsWith('ko');
  const strings = korean ? {
    ready: '앱에서 연결을 마무리하세요',
    description: 'RisuNest로 돌아가 Google Drive 연결을 마무리하세요. 앱이 열리지 않으면 인증 결과를 복사해 앱에 붙여넣을 수 있습니다.',
    denied: '인증이 완료되지 않았습니다',
    deniedDescription: '앱으로 돌아가 다시 시도할 수 있습니다.',
    invalid: '인증 결과를 찾을 수 없습니다',
    invalidDescription: 'RisuNest의 Google Drive 연결 설정에서 인증을 시작한 뒤 이 페이지로 돌아오세요.',
    open: 'RisuNest로 돌아가기', copy: '인증 결과 복사', copied: '복사했습니다. 앱의 인증 결과 입력란에 붙여넣으세요.',
    manual: '아래 내용을 복사해 앱의 인증 결과 입력란에 붙여넣으세요.', footer: '연결이 끝나면 이 창을 닫아도 됩니다.'
  } : {
    ready: 'Finish connecting in the app',
    description: 'Return to RisuNest to finish connecting Google Drive. If the app does not open, copy the result and paste it into the app.',
    denied: 'Authorization was not completed', deniedDescription: 'Return to the app to try again.',
    invalid: 'No authorization result found', invalidDescription: 'Start authorization from Google Drive connection settings in RisuNest, then return here.',
    open: 'Return to RisuNest', copy: 'Copy authorization result', copied: 'Copied. Paste it into the authorization result field in the app.',
    manual: 'Copy the text below and paste it into the authorization result field in the app.', footer: 'You can close this page after connecting.'
  };
  document.documentElement.lang = korean ? 'ko' : 'en';
  const byId = (id) => document.getElementById(id);
  byId('open').textContent = strings.open;
  byId('copy').textContent = strings.copy;
  byId('manual-label').textContent = strings.manual;
  byId('footer').textContent = strings.footer;
  const source = new URL(window.location.href);
  const params = source.searchParams;
  const state = params.get('state');
  const code = params.get('code');
  const error = params.get('error');
  const single = (name) => params.getAll(name).length <= 1;
  const valid = state && state.length <= 512 && !/[\x00-\x20\x7f]/.test(state)
    && single('state') && single('code') && single('error')
    && !source.hash && ((code && code.length <= 8192 && !error) || (error && error.length <= 256 && !code));
  const result = new URL(source.origin + source.pathname);
  const app = new URL('risunestlocal://oauth/google-drive');
  if (valid) {
    for (const [name, value] of [['state', state], [code ? 'code' : 'error', code || error]]) {
      result.searchParams.set(name, value);
      app.searchParams.set(name, value);
    }
  }
  window.history.replaceState(null, '', source.pathname);
  byId('title').textContent = valid ? (code ? strings.ready : strings.denied) : strings.invalid;
  byId('description').textContent = valid ? (code ? strings.description : strings.deniedDescription) : strings.invalidDescription;
  if (!valid) return;
  byId('actions').hidden = false;
  byId('open').href = app.href;
  byId('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(result.href);
      byId('notice').textContent = strings.copied;
    } catch {
      byId('manual').hidden = false;
      byId('result').value = result.href;
      byId('result').focus();
      byId('result').select();
    }
  });
  if (/Android/i.test(navigator.userAgent)) {
    window.setTimeout(() => window.location.assign(app.href), 300);
  }
})();
  </script>
