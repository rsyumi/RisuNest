[package]
name = "risunest-sync-server"
version = "1.1.1"
edition = "2021"
publish = false

[features]
# Installer builds run directly under Task Scheduler without a console window.
windows-background = []
# Compiles the LWW benchmark's source observer into this crate's own test
# builds. It has no effect outside `cargo test`.
source-observer = []

[dependencies]
risunest-release-update = { path = "../../crates/release-update" }
risunest-sync-wire = { path = "../../crates/sync-wire", features = ["body-codec"] }
risunest-sync-connect = { path = "../../crates/sync-connect" }
risunest-small-object-store = { path = "../../crates/small-object-store" }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "fs", "process", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
http-body = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
hex = "0.4"
getrandom = "0.2"
uuid = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
qrcode = { version = "0.14", default-features = false }
base64 = "0.23.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Lets the default tests observe the hashing inside sync-wire.
risunest-sync-wire = { path = "../../crates/sync-wire", features = ["source-observer"] }
tokio-tungstenite = "0.29"
minisign = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
