[package]
name = "risunest-sync-manager"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
risunest-sync-server = { path = "../sync" }
risunest-release-update = { path = "../../crates/release-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
crossterm = "0.29"
qrcode = { version = "0.14", default-features = false }
tempfile = "3"
fs2 = "0.4"
async-trait = "0.1"
flate2 = "1"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
semver = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
