[package]
name = "risunest-persistence-boundary"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
risunest = { path = "../../../src-tauri" }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
serde_json = "1"
# Cargo only forwards plugin permission metadata to direct dependents.
# These are the same plugins/versions already used by the product builder.
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-fs = "2.7.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.6"
# The plugin's default features without `cookies`, which the product leaves off.
tauri-plugin-http = { version = "2.8.0", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol", "risunest/custom-protocol"]

[patch.crates-io]
wry = { path = "../../../crates/wry" }
tauri-plugin-updater = { path = "../../../crates/tauri-plugin-updater" }
tauri-plugin-http = { path = "../../../crates/tauri-plugin-http" }
tauri-plugin-window-state = { path = "../../../crates/tauri-plugin-window-state" }
tauri-plugin-single-instance = { path = "../../../crates/tauri-plugin-single-instance" }
