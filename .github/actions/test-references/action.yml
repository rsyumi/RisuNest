name: Prepare pinned compatibility references
description: Check out approved reference source without starting or installing either application
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: kwaroran/Risuai
        ref: ea61945f9038e0189807d075f55f4e66ab7e98bf
        path: .tmp/test-references/risuai
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: PocketRisu/PocketRisu
        ref: b315d898abd543fffaf5346d8eb3246b20da92cd
        path: .tmp/test-references/pocket
        persist-credentials: false
    - name: Prepare isolated reference libraries
      shell: bash
      run: |
        node scripts/compatibleExportDependencies.mjs --prepare
        pnpm --dir .tmp/test-reference-dependencies/risuai install --no-frozen-lockfile
        pnpm --dir .tmp/test-reference-dependencies/pocket install --no-frozen-lockfile
