name: Stable release

on:
  push:
    tags:
      - "app-v*"
      - "sync-v*"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      product: ${{ startsWith(github.ref_name, 'app-v') && 'app' || 'sync' }}
      tag: ${{ github.ref_name }}
      source_ref: ${{ github.sha }}
      publish: true
      bootstrap: ${{ vars.RISUNEST_RELEASE_BOOTSTRAP == 'true' }}
    secrets:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      RISUNEST_UPDATE_PUBLIC_KEY: ${{ secrets.RISUNEST_UPDATE_PUBLIC_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RISUNEST_DEFAULT_REGISTRY_URL: ${{ secrets.RISUNEST_DEFAULT_REGISTRY_URL }}
