name: Stable release

on:
  push:
    tags:
      - "app-v*"
      - "sync-v*"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      product: ${{ startsWith(github.ref_name, 'app-v') && 'app' || 'sync' }}
      tag: ${{ github.ref_name }}
      source_ref: ${{ github.sha }}
      publish: true
      bootstrap: ${{ vars.RISUNEST_RELEASE_BOOTSTRAP == 'true' }}
    secrets: inherit
