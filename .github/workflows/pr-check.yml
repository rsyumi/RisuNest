name: PR Check

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Linux / Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run svelte-check
        run: pnpm check

      - name: Check test and configuration types
        run: pnpm check:tests

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - uses: ./.github/actions/test-references
      - name: Run Node contracts
        run: pnpm test:node

  independent-frontends:
    name: Independent frontend checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server/manager/gui --ignore-workspace install --frozen-lockfile
      - run: pnpm --dir server/endpoint-registry --ignore-workspace install --frozen-lockfile
      - run: pnpm check:test-inventory
      - run: pnpm --dir server/manager/gui --ignore-workspace check
      - run: pnpm test:manager
      - run: pnpm --dir server/endpoint-registry --ignore-workspace check
      - run: pnpm test:registry

  shared-protocols:
    name: Shared Rust and WASM contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install native and WASM build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm pkg-config libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev gnome-keyring dbus-x11
      - run: pnpm install --frozen-lockfile
      - name: Install the locked WASM binding generator
        shell: pwsh
        run: |
          $lock = Get-Content -Raw crates/external-storage-wasm/Cargo.lock
          $version = [regex]::Match($lock, 'name = "wasm-bindgen"\r?\nversion = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing wasm-bindgen lockfile version' }
          cargo install wasm-bindgen-cli --version $version --locked
          if ($LASTEXITCODE -ne 0) { throw 'wasm-bindgen installation failed' }
      - run: pnpm test:protocol
      - run: pnpm test:wasm
      - name: Recheck native artifacts after the standalone WASM build
        run: dbus-run-session -- bash scripts/linux-native-tests.sh --lib external_storage -- --test-threads=1
