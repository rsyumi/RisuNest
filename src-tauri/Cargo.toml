[package]
name = "risunest"
version = "1.3.0"
description = "RisuNest"
authors = ["Yumi"]
license = ""
repository = "https://github.com/rsyumi/RisuNest"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
cc = "1"
risunest-release-update = { path = "../crates/release-update" }

[dependencies]
risunest-network-log = { path = "../crates/network-log", features = ["reqwest"] }
axum = "0.8.9"
tempfile = "3"
dirs = "6"
fs2 = "0.4"
risunest-release-update = { path = "../crates/release-update" }
risunest-sync-wire = { path = "../crates/sync-wire", features = ["body-codec"] }
risunest-sync-connect = { path = "../crates/sync-connect" }
risunest-external-storage-format = { path = "../crates/external-storage-format" }
risunest-small-object-store = { path = "../crates/small-object-store" }
zeroize = "1"
aes = "0.8.4"
ghash = "0.5.1"
subtle = "2.6"
tauri = { version = "2.12.5", features = ["protocol-asset", "devtools"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "blob", "hooks"] }
ryu-js = { version = "1.0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "raw_value", "unbounded_depth"] }
sha2 = "0.11.0"
tiktoken-rs = "=0.12.1"
base64 = "0.23.1"
cap-primitives = "4.0.3"
zip = "0.6.6"
futures = "0.3.30"
async-trait = "0.1"
url = "2.2"
uuid = { version = "1.9.1", features = [ "v4" ] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-fs = "2.7.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2.7.1"
# Native callers may supply Cookie, Origin, Referer and other HTTP headers.
# There is no cookie jar, so a request carries only the cookies its caller sets.
# The plugin takes its TLS from `platform_tls`, so it enables no TLS feature.
tauri-plugin-http = { version = "2.8.0", default-features = false, features = ["unsafe-headers", "http2", "charset", "system-proxy", "gzip"] }
oauth2 = "5.0.0"
# External storage adapters: request signing, DAV/S3 XML, path escaping, Retry-After dates.
hmac = "0.13.0"
quick-xml = { version = "0.41", features = ["serialize"] }
percent-encoding = "2"
httpdate = "1"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "rt-multi-thread", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
libc = { version = "0.2", optional = true }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
png = "0.18.1"
zune-jpeg = "0.5.15"
webp = "0.3.1"
flate2 = "1.1.2"
crc32fast = "1.5.0"
rmpv = "1.3.0"
rmp = "0.8.15"
time = { version = "0.3.55", features = ["formatting", "large-dates", "parsing"] }
[features]
official-distribution = []
default = ["native-kei-upload-pilot", "native-official-publication"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
native-official-publication = [
    "dep:libc",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
]
official-publication-upload-pilot = ["native-official-publication"]
native-kei-upload-pilot = [
    "dep:ryu-js",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
]

[lib]
name = "risunest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2.5.1"
notify-rust = "=4.18.1"
getrandom = "0.2.15"
reqwest = { version = "0.12.28", features = ["blocking", "json"] }

[target.'cfg(any(windows, target_os = "android", target_os = "linux", target_os = "ios", target_os = "macos"))'.dependencies]
regex = "1.13.1"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
os_info = "3.15.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
webview2-com = "0.39.1"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_WinRT", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3.7.0"
# Reads the WebKit termination reason inside the web content process handler.
wry = "=0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_34"] }
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
dbus = "0.9.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "objc2-core-foundation", "NSApplication", "NSWorkspace", "NSWindow", "NSView", "NSImageView", "NSImage", "NSColor", "NSRunningApplication", "NSResponder", "NSBox", "NSControl", "NSCell", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSError", "NSArray", "NSDictionary", "NSObject", "NSGeometry", "objc2-core-foundation"] }
block2 = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10.1"
security-framework-sys = "2.17.0"
tauri-plugin-ios-native = { path = "../crates/tauri-plugin-ios-native" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { path = "../crates/tauri-plugin-barcode-scanner" }

[target.'cfg(target_os = "android")'.dependencies]
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# Verifies native connections through Android, which applies the network
# security config.
rustls-platform-verifier = "0.7.1"
getrandom = "0.2.15"
jni = "0.21.1"
# The verifier's initializer takes this jni version; other bridges keep 0.21.
jni022 = { package = "jni", version = "0.22.4" }
# The webpki roots serve only the update check, which keeps its own client.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
native-tls = "0.2.18"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
reqwest = { version = "0.12.28", features = ["blocking", "json", "native-tls", "stream"] }

[dev-dependencies]
wry = "=0.57.0"
tao = "0.37.1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tiny_http = "0.12.0"
risunest-sync-server = { path = "../server/sync" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "test-util"] }
tauri = { version = "2.12.5", features = ["test"] }
regex = "1.13.1"

[patch.crates-io]
# On Android, run main-frame-only scripts in the top frame, stream large
# custom-protocol responses instead of copying them into one Java array, and
# hand a WebView whose renderer exited to the app's recovery.
wry = { path = "../crates/wry" }
# Keep failed desktop updates from closing or discarding the installed app.
tauri-plugin-updater = { path = "../crates/tauri-plugin-updater" }
# Let the window state file follow the manifest root instead of the
# identifier-derived configuration directory.
tauri-plugin-window-state = { path = "../crates/tauri-plugin-window-state" }
# Accept a string request body as text instead of a JSON number array.
tauri-plugin-http = { path = "../crates/tauri-plugin-http" }
# Key each launch profile's single instance separately on every desktop platform.
tauri-plugin-single-instance = { path = "../crates/tauri-plugin-single-instance" }
