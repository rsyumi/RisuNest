[package]
name = "risuai"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "devtools"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
ryu-js = { version = "1.0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tiktoken-rs = "0.4.0"
base64 = "0.21.0"
darling = "0.20.3"
zip = "0.6.6"
tar = "0.4.40"
eventsource-client = "0.12.2"
futures = "0.3.30"
url = "2.2"
uuid = { version = "1.9.1", features = [ "v4" ] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-fs = "2.5.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2.5.9"
oauth2 = "5.0.0"
tokio = { version = "1.47.1", features = ["time"] }
tokio-util = { version = "0.7.19", features = ["io"], optional = true }
libc = { version = "0.2", optional = true }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
webp = "0.3.1"
flate2 = "1.1.2"
crc32fast = "1.5.0"
rmpv = "1.3.0"
time = "0.3.55"
[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
official-publication-upload-pilot = [
    "dep:libc",
    "dep:tokio-util",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
]
native-kei-upload-pilot = [
    "dep:ryu-js",
    "dep:tokio-util",
    "reqwest/stream",
    "tokio/fs",
    "tokio/io-util",
]

[lib]
name = "risuai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tiny_http = "0.12.0"
reqwest = { version = "0.11.16", features = ["blocking", "json"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.11.16", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.11.16", features = ["json"] }

[dev-dependencies]
tempfile = "3"
