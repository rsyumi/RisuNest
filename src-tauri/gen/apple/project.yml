name: risunest
options:
  bundleIdPrefix: io.github.rsyumi.risunest
  deploymentTarget:
    iOS: 16.4
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: RisuNest
      PRODUCT_BUNDLE_IDENTIFIER: io.github.rsyumi.risunest
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  risunest_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: risunest_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: risunest_iOS/Info.plist
      properties:
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.rsyumi.risunest.risum
            UTTypeConformsTo: [public.data]
            UTTypeDescription: risum
            UTTypeTagSpecification:
              public.filename-extension: [risum]
          - UTTypeIdentifier: io.github.rsyumi.risunest.risup
            UTTypeConformsTo: [public.data]
            UTTypeDescription: risup
            UTTypeTagSpecification:
              public.filename-extension: [risup]
          - UTTypeIdentifier: io.github.rsyumi.risunest.charx
            UTTypeConformsTo: [public.data]
            UTTypeDescription: charx
            UTTypeTagSpecification:
              public.filename-extension: [charx]
          - UTTypeIdentifier: io.github.rsyumi.risunest.risudat
            UTTypeConformsTo: [public.data]
            UTTypeDescription: risudat
            UTTypeTagSpecification:
              public.filename-extension: [risudat]
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        NSCameraUsageDescription: Scan a QR code you choose to connect RisuNest.
        NSLocalNetworkUsageDescription: Connect to a local AI provider or RisuNest sync server that you choose.
        LSSupportsOpeningDocumentsInPlace: false
        BGTaskSchedulerPermittedIdentifiers: [io.github.rsyumi.risunest.generation]
        UIBackgroundModes: [processing]
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [risunestlocal]
            CFBundleURLName: risunestlocal
    entitlements:
      path: risunest_iOS/risunest_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: pnpm tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
